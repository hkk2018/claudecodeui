# claudecodeui .gitleaks.toml — commit-time + full-history secret scan allowlist
# WHAT: false-positive baseline from the full-history scan (tech-center
#       #10692 public-repo pre-push rollout, 2026-10-23) — 8 raw matches,
#       all triaged and confirmed false positive.
# WHY:  allowlist by COMMIT, never by the matched secret VALUE.

[extend]
useDefault = true

[allowlist]
